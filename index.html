  <!-- Ban checker -->
  <script>
    (function () {

      const $ = (id) =>
        document.getElementById(id);

      const isLocal =
        ["localhost", "127.0.0.1"]
        .includes(location.hostname);

      async function getToken() {

        let token =
          document.querySelector(
            'meta[name="page-token"]'
          )?.content || "";

        if (!token) {

          try {

            const response =
              await fetch(
                "/api/get-token",
                {
                  headers: {
                    "Accept":
                      "application/json"
                  }
                }
              );

            const data =
              await response.json();

            token =
              data.token || "";

          } catch {}
        }

        return token;
      }

      function normalize(number) {

        if (!number)
          return null;

        number =
          number
            .trim()
            .replace(/[^\d+]/g, "")
            .replace(/\+/g, "");

        if (!number)
          return null;

        if (
          number.startsWith("0")
        ) {
          number =
            "49" +
            number.slice(1);
        }

        return "+" + number;
      }

      function isValid(number) {

        const normalized =
          normalize(number);

        return (
          !!normalized &&
          /^\+\d{7,15}$/
          .test(normalized)
        );
      }

      function showError(message) {

        const element =
          $("check-error");

        element.textContent =
          message;

        element.classList.remove(
          "hidden"
        );
      }

      function clearError() {

        $("check-error")
          .classList.add(
            "hidden"
          );
      }

      function isBanned(data) {

        return (
          data?.banned === true ||
          data?.banned === 1 ||
          data?.banned === "true" ||
          data?.banned === "1" ||

          data?.mod_ban === true ||
          data?.mod_ban === 1 ||
          data?.mod_ban === "true" ||
          data?.mod_ban === "1"
        );
      }

      function render(number, response) {

        const data =
          response?.data ||
          response?.result ||
          response ||
          {};

        const banned =
          isBanned(data);

        const reason =
          data.violation_label ||
          data.violation_reason ||
          data.reason ||
          data.ban_reason ||
          "";

        const banner =
          $("result-banner");

        const ICON_BAN =
          '<svg viewBox="0 0 24 24" ' +
          'fill="none" ' +
          'stroke="currentColor" ' +
          'stroke-width="1.5" ' +
          'stroke-linecap="round" ' +
          'stroke-linejoin="round">' +
          '<circle cx="12" cy="12" r="10"/>' +
          '<path d="m4.9 4.9 14.2 14.2"/>' +
          '</svg>';

        const ICON_OK =
          '<svg viewBox="0 0 24 24" ' +
          'fill="none" ' +
          'stroke="currentColor" ' +
          'stroke-width="1.5" ' +
          'stroke-linecap="round" ' +
          'stroke-linejoin="round">' +
          '<circle cx="12" cy="12" r="10"/>' +
          '<path d="m9 12 2 2 4-4"/>' +
          '</svg>';

        if (banned) {

          banner.className =
            "status-banner banned";

          banner.innerHTML =
            '<div class="s-icon banned">' +
              ICON_BAN +
            '</div>' +

            '<div>' +

              '<div class="s-title">' +
                number +
              '</div>' +

              '<div class="s-sub">' +
                'This number ban by Cifer' +
              '</div>' +

            '</div>';

          $("r-status").textContent =
            "Banned";

          $("r-status").className =
            "row-v banned";

          $("r-reason").textContent =
            reason ||
            "Not specified";

          $("r-bantime").textContent =
            data.ban_time
              ? new Date(
                  Number(data.ban_time) * 1000
                ).toLocaleString()
              : "—";

          $("r-appealtime").textContent =
            data.appeal_creation_time
              ? new Date(
                  Number(
                    data.appeal_creation_time
                  ) * 1000
                ).toLocaleString()
              : "—";

        } else {

          banner.className =
            "status-banner active";

          banner.innerHTML =
            '<div class="s-icon active">' +
              ICON_OK +
            '</div>' +

            '<div>' +

              '<div class="s-title">' +
                number +
              '</div>' +

              '<div class="s-sub">' +
                'This number is not banned.' +
              '</div>' +

            '</div>';

          $("r-status").textContent =
            "Not banned";

          $("r-status").className =
            "row-v active";

          $("r-reason").textContent =
            "—";

          $("r-bantime").textContent =
            "—";

          $("r-appealtime").textContent =
            "—";
        }

        $("step-input")
          .classList.add(
            "hidden"
          );

        $("step-result")
          .classList.remove(
            "hidden"
          );
      }

      async function check() {

        clearError();

        let number =
          $("phone-input")
          .value
          .trim();

        if (!number) {

          showError(
            "Please enter a phone number."
          );

          return;
        }

        if (!isValid(number)) {

          showError(
            "Please enter a valid phone number."
          );

          return;
        }

        number =
          normalize(number);

        const captchaToken =
          isLocal
            ? ""
            : (
                document.querySelector(
                  'input[name="cf-turnstile-response"]'
                )?.value || ""
              );

        if (
          !isLocal &&
          !captchaToken
        ) {

          showError(
            "Please complete the captcha first."
          );

          return;
        }

        const button =
          $("check-btn");

        const original =
          button.innerHTML;

        button.disabled =
          true;

        button.innerHTML =
          '<span class="spin"></span> Checking...';

        try {

          const pageToken =
            await getToken();

          const response =
            await fetch(
              "/check-numberr2",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Cache-Control":
                    "no-cache",

                  "X-Page-Token":
                    pageToken
                },

                body:
                  JSON.stringify({
                    number:
                      number,

                    "cf-turnstile-response":
                      captchaToken
                  })
              }
            );

          const text =
            await response.text();

          let data;

          try {

            data =
              JSON.parse(text);

          } catch {

            showError(
              "Invalid response from server."
            );

            return;
          }

          if (!response.ok) {

            showError(
              data?.error ||
              data?.message ||
              ("Server error " +
               response.status)
            );

            return;
          }

          render(
            number,
            data
          );

        } catch (error) {

          showError(
            "Network error: " +
            (
              error?.message ||
              "Unable to contact server."
            )
          );

        } finally {

          button.disabled =
            false;

          button.innerHTML =
            original;

          if (
            window.turnstile
          ) {

            window.turnstile.reset();
          }
        }
      }

      $("check-btn")
        .addEventListener(
          "click",
          check
        );

      $("phone-input")
        .addEventListener(
          "keydown",
          function (event) {

            if (
              event.key === "Enter"
            ) {
              check();
            }
          }
        );

      $("again-btn")
        .addEventListener(
          "click",
          function () {

            $("step-result")
              .classList.add(
                "hidden"
              );

            $("step-input")
              .classList.remove(
                "hidden"
              );

            $("phone-input")
              .value = "";

            clearError();

            $("phone-input")
              .focus();
          }
        );

    })();
  </script>

</body>
</html>
