<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WhatsApp Ban Checker — Dev Cifer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #260000 0%, #090909 45%, #000 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(15, 15, 15, 0.96);
      border: 1px solid #390000;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.15);
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: cover;
      display: block;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 2px solid #ff2020;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.35);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      outline: none;
      background: #090909;
      color: white;
      font-size: 16px;
      transition: .2s;
    }

    input:focus {
      border-color: #ff2020;
      box-shadow: 0 0 12px rgba(255, 0, 0, .15);
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #e50909;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover:not(:disabled) {
      background: #ff2020;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      display: none;
      padding: 17px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .banned {
      display: block !important;
      background: rgba(150, 0, 0, .18);
      border: 1px solid #ff2020;
      color: #ff4545;
    }

    .not-banned {
      display: block !important;
      background: rgba(255, 170, 0, .10);
      border: 1px solid #d99b00;
      color: #ffc247;
    }

    .error {
      display: block !important;
      background: rgba(255, 255, 255, .05);
      border: 1px solid #555;
      color: #ddd;
    }

    .loading {
      display: block !important;
      background: rgba(255, 255, 255, .04);
      border: 1px solid #333;
      color: #aaa;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: #666;
    }

    .footer a {
      color: #ff3030;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="/images/dev-cifer.jpg"
      alt="Dev Cifer"
      class="logo"
      onerror="this.style.display='none'"
    >

    <h1>WhatsApp Ban Checker</h1>

    <p class="subtitle">
      Dev Cifer — Number Status Checker
    </p>

    <label for="phone">
      Numéro WhatsApp
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="tel"
      autocomplete="tel"
      placeholder="+2250700000000"
    >

    <button id="checkBtn">
      CHECK NUMBER
    </button>

    <div id="result"></div>

    <div class="footer">
      Dev Cifer •
      <a href="https://t.me/devcifer" target="_blank" rel="noopener">
        Telegram
      </a>
    </div>

  </main>

<script>
  const phoneInput = document.getElementById("phone");
  const checkBtn = document.getElementById("checkBtn");
  const result = document.getElementById("result");

  /*
    IMPORTANT :

    Si ton Worker est sur un autre domaine,
    remplace cette URL par celle de ton Worker.

    Exemple :
    https://ton-worker.workers.dev/check-numberr2
  */
  const API_URL = "/check-numberr2";


  function normalizeNumber(value) {
    return value
      .trim()
      .replace(/[^\d+]/g, "");
  }


  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function showResult(type, message) {
    result.className = type;
    result.innerHTML = message;
    result.style.display = "block";
  }


  /*
    Détermine si le backend confirme réellement
    que le numéro est banni/suspendu pour SPAM.
  */
  function detectBanned(data) {

    if (!data || typeof data !== "object") {
      return false;
    }

    const possibleValues = [
      data.banned,
      data.is_banned,
      data.isBanned,
      data.mod_ban,
      data.ban,
      data.suspended,
      data.is_suspended,
      data.isSuspended
    ];

    for (const value of possibleValues) {

      if (
        value === true ||
        value === 1 ||
        String(value).toLowerCase() === "true" ||
        String(value).toLowerCase() === "banned" ||
        String(value).toLowerCase() === "suspended" ||
        String(value).toLowerCase() === "spam"
      ) {
        return true;
      }
    }

    /*
      Vérifie aussi certains champs texte
      envoyés par le backend.
    */
    const statusValues = [
      data.status,
      data.state,
      data.result,
      data.message
    ];

    for (const value of statusValues) {

      if (typeof value !== "string") {
        continue;
      }

      const text = value.toLowerCase();

      if (
        text.includes("banned") ||
        text.includes("suspended") ||
        text.includes("spam")
      ) {
        return true;
      }
    }

    return false;
  }


  /*
    Détermine explicitement si le backend confirme
    que le numéro n'est PAS banni.
  */
  function detectNotBanned(data) {

    if (!data || typeof data !== "object") {
      return false;
    }

    const values = [
      data.banned,
      data.is_banned,
      data.isBanned,
      data.mod_ban,
      data.ban,
      data.suspended,
      data.is_suspended,
      data.isSuspended
    ];

    for (const value of values) {

      if (
        value === false ||
        value === 0 ||
        String(value).toLowerCase() === "false" ||
        String(value).toLowerCase() === "not banned" ||
        String(value).toLowerCase() === "not_banned" ||
        String(value).toLowerCase() === "safe" ||
        String(value).toLowerCase() === "unbanned"
      ) {
        return true;
      }
    }

    const statusValues = [
      data.status,
      data.state,
      data.result
    ];

    for (const value of statusValues) {

      if (typeof value !== "string") {
        continue;
      }

      const text = value.toLowerCase().trim();

      if (
        text === "safe" ||
        text === "not banned" ||
        text === "not_banned" ||
        text === "unbanned"
      ) {
        return true;
      }
    }

    return false;
  }


  function renderResult(data, number) {

    /*
      1. BANNI / SPAM / SUSPENDU
    */
    if (detectBanned(data)) {

      showResult(
        "banned",
        "🚫 This number is banned by Cifer"
      );

      return;
    }


    /*
      2. PAS BANNI
      Ton message demandé :
      "Numéro incorrect"
    */
    if (detectNotBanned(data)) {

      showResult(
        "not-banned",
        "⚠️ Numéro incorrect"
      );

      return;
    }


    /*
      3. Le backend ne donne pas un résultat
         suffisamment clair.

      On NE dit PAS que le numéro est banni
      et on NE dit PAS qu'il ne l'est pas.
    */
    showResult(
      "error",
      "Impossible de déterminer le statut réel du numéro."
    );
  }


  async function checkNumber() {

    const number = normalizeNumber(phoneInput.value);

    if (!number) {

      showResult(
        "error",
        "Entre un numéro WhatsApp."
      );

      return;
    }


    checkBtn.disabled = true;

    showResult(
      "loading",
      "⏳ Vérification en cours..."
    );


    try {

      const response = await fetch(API_URL, {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify({
          number: number,
          phone: number
        })
      });


      const contentType =
        response.headers.get("content-type") || "";


      if (!response.ok) {

        throw new Error(
          "Erreur serveur HTTP " + response.status
        );
      }


      if (!contentType.includes("application/json")) {

        throw new Error(
          "Le serveur n'a pas renvoyé du JSON."
        );
      }


      const data = await response.json();

      console.log("Réponse du backend :", data);

      renderResult(data, number);


    } catch (error) {

      console.error("Erreur :", error);

      showResult(
        "error",
        "❌ Impossible de vérifier le numéro. Réessaie."
      );

    } finally {

      checkBtn.disabled = false;
    }
  }


  checkBtn.addEventListener(
    "click",
    checkNumber
  );


  phoneInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        checkNumber();
      }

    }
  );
</script>

</body>
</html>
